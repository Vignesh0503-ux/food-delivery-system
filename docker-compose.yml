version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  user-service:
    image: vignesh05032005/food-delivery-system-user-service:latest

    ports:
      - "8081:8081"
      - "9091:9091"

  notification-service:
    image: vignesh05032005/food-delivery-system-notification-service:latest
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
      - "9093:9093"

  order-service:
    image: vignesh05032005/food-delivery-system-order-service:latest
    depends_on:
      - kafka
      - user-service
      - notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USER_SERVICE_GRPC_ADDRESS: static://user-service:9091
      NOTIFICATION_SERVICE_GRPC_ADDRESS: static://notification-service:9093
    ports:
      - "8082:8082"

  delivery-service:
    image: vignesh05032005/food-delivery-system-delivery-service:latest
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8084:8084"
      - "9094:9094"

  api-gateway:
    image: vignesh05032005/food-delivery-system-api-gateway:latest
    depends_on:
      - user-service
      - order-service
      - delivery-service
    environment:
      USER_SERVICE_URI: http://user-service:8081
      ORDER_SERVICE_URI: http://order-service:8082
      DELIVERY_SERVICE_URI: http://delivery-service:8084
    ports:
      - "8080:8080"

  # Not started by default (`docker compose up`) - run on demand, e.g.:
  #   docker compose run --rm driver-simulator localhost 9094 driver-1 track
  driver-simulator:
    build:
      context: .
      dockerfile: driver-simulator/Dockerfile
    profiles: ["tools"]
    depends_on:
      - delivery-service
    entrypoint: ["java", "-jar", "simulator.jar", "delivery-service", "9094", "driver-1", "track"]
