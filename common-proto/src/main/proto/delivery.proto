syntax = "proto3";

package fooddelivery.delivery;

option java_multiple_files = true;
option java_package = "com.fooddelivery.grpc.delivery";
option java_outer_classname = "DeliveryProto";

service DeliveryService {

  // CLIENT STREAMING

  rpc UploadLocationHistory (stream LocationPing) returns (LocationHistoryAck);

  // BIDIRECTIONAL STREAMING

  rpc TrackDriver (stream DriverUpdate) returns (stream DispatchInstruction);
}

message LocationPing {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  int64 timestamp = 4;
}

message LocationHistoryAck {
  string driver_id = 1;
  int32 pings_received = 2;
}

message DriverUpdate {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  string status = 4; // AVAILABLE, EN_ROUTE, DELIVERING
  int64 timestamp = 5;
}

message DispatchInstruction {
  string driver_id = 1;
  string instruction_type = 2; // ASSIGN_ORDER, REROUTE, GO_OFFLINE, NOOP
  string order_id = 3;
  string message = 4;
}
