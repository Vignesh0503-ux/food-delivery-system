server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/orders/**
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/drivers/**

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
